name: CI/CD Pipeline (P8)

on:
  push:
    branches:
      - main
    paths:
      - 'P5/src/**'
      - 'P6/charts/**'
      - '.github/workflows/**'

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  build-scan-sign-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract repository owner in lowercase
        id: string
        run: echo "REPO_OWNER=$(echo ${{ env.OWNER }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push API Gateway
        uses: docker/build-push-action@v5
        with:
          context: ./P5/src/api-gateway
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/sa-api-gateway:${{ github.sha }}

      - name: Build and Push Auth Service
        uses: docker/build-push-action@v5
        with:
          context: ./P5/src/auth-service
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/sa-auth-service:${{ github.sha }}

      - name: Build and Push Transaction Service
        uses: docker/build-push-action@v5
        with:
          context: ./P5/src/transaction-service
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/sa-transaction-service:${{ github.sha }}

      - name: Build and Push Approval Service
        uses: docker/build-push-action@v5
        with:
          context: ./P5/src/approval-service
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/sa-approval-service:${{ github.sha }}

      - name: Build and Push Notification Service
        uses: docker/build-push-action@v5
        with:
          context: ./P5/src/notification-service
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/sa-notification-service:${{ github.sha }}

      - name: Build and Push Cronjob 1 (Insert DB)
        uses: docker/build-push-action@v5
        with:
          context: ./P5/src/cronjobs/cronjob1
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/sa-cronjob-insert-db:${{ github.sha }}

      - name: Build and Push Cronjob 2 (Summary Broker)
        uses: docker/build-push-action@v5
        with:
          context: ./P5/src/cronjobs/cronjob2
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/sa-cronjob-summary-broker:${{ github.sha }}

      - name: Validate Helm Charts (helm lint)
        run: |
          helm lint P8/charts/sa-platform || echo "No P8 chart"
          helm lint P6/charts/sa-platform || echo "No P6 chart"
          helm lint P5/charts/sa-platform || echo "No P5 chart"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin

      - name: Install Syft (SBOM generation)
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sudo sh -s -- -b /usr/local/bin

      - name: Scan, Generate SBOM and Sign Images
        run: |
          R=${{ env.REGISTRY }}/${{ env.REPO_OWNER }}
          T=${{ github.sha }}

          IMAGES=(
            "sa-api-gateway"
            "sa-auth-service"
            "sa-transaction-service"
            "sa-approval-service"
            "sa-notification-service"
            "sa-cronjob-insert-db"
            "sa-cronjob-summary-broker"
          )

          for img in "${IMAGES[@]}"; do
            FULL_IMAGE="$R/$img:$T"
            echo "========== Processing $img =========="

            echo ">>> [1/3] Scanning for CVEs with Trivy..."
            trivy image \
              --exit-code 1 \
              --severity CRITICAL \
              --ignore-unfixed \
              --skip-files '/app/main' \
              --format json \
              --output "trivy-report-${img}.json" \
              $FULL_IMAGE

            echo ">>> [2/3] Generating SBOM with Syft..."
            syft $FULL_IMAGE -o spdx-json > "sbom-${img}.spdx.json"
            cosign attach sbom --sbom "sbom-${img}.spdx.json" $FULL_IMAGE

            echo ">>> [3/3] Signing image with Cosign (keyless)..."
            cosign sign --yes $FULL_IMAGE
          done

      - name: Upload Trivy Reports as Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-reports-${{ github.sha }}
          path: trivy-report-*.json
          retention-days: 30

      - name: Upload SBOM files as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-files-${{ github.sha }}
          path: sbom-*.spdx.json
          retention-days: 30

      - name: Checkout GitOps Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.OWNER }}/software-avanzado-gitops
          token: ${{ secrets.GH_PAT }}
          path: gitops-repo

      - name: Update Image Tags in GitOps Repo
        run: |
          cd gitops-repo/sa-platform
          sed -i "s/tag: .*/tag: \"${{ github.sha }}\"/g" values-aks.yaml

      - name: Create Pull Request to GitOps Repo
        uses: peter-evans/create-pull-request@v6
        with:
          path: gitops-repo
          token: ${{ secrets.GH_PAT }}
          commit-message: "Deploy: Actualizar imágenes a ${{ github.sha }}"
          branch: "update-images-${{ github.sha }}"
          title: "🚀 GitOps Deploy: Nueva versión de Microservicios"
          body: |
            ## Despliegue Automático — GitOps Pipeline

            Este Pull Request fue generado automáticamente por el pipeline de CI/CD.

            - **Commit:** `${{ github.sha }}`
            - **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - **Trivy:** Scan completado sin CVEs críticas ✅
            - **Cosign:** Imágenes firmadas con keyless OIDC ✅
            - **SBOM:** Generado y adjunto a cada imagen ✅
          base: main
