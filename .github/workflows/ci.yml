name: CI/CD Pipeline (P7)

on:
  push:
    branches:
      - main
    paths:
      - 'P5/src/**'
      - 'P6/charts/**'
      - '.github/workflows/**'

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract repository owner in lowercase
        id: string
        run: echo "REPO_OWNER=$(echo ${{ env.OWNER }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push API Gateway
        uses: docker/build-push-action@v5
        with:
          context: ./P5/src/api-gateway
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/sa-api-gateway:${{ github.sha }}

      - name: Build and Push Auth Service
        uses: docker/build-push-action@v5
        with:
          context: ./P5/src/auth-service
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/sa-auth-service:${{ github.sha }}

      - name: Build and Push Transaction Service
        uses: docker/build-push-action@v5
        with:
          context: ./P5/src/transaction-service
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/sa-transaction-service:${{ github.sha }}

      - name: Build and Push Approval Service
        uses: docker/build-push-action@v5
        with:
          context: ./P5/src/approval-service
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/sa-approval-service:${{ github.sha }}

      - name: Build and Push Notification Service
        uses: docker/build-push-action@v5
        with:
          context: ./P5/src/notification-service
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/sa-notification-service:${{ github.sha }}

      - name: Build and Push Cronjobs
        uses: docker/build-push-action@v5
        with:
          context: ./P5/src/cronjobs
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/sa-cronjobs:${{ github.sha }}

      - name: Set up Kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Set Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Deploy to AKS
        run: |
          R=${{ env.REGISTRY }}/${{ env.REPO_OWNER }}
          T=${{ github.sha }}
          
          helm upgrade --install sa-platform ./P6/charts/sa-platform \
            -f ./P6/charts/sa-platform/values-aks.yaml \
            --namespace sa-p6 --create-namespace \
            --set api-gateway.image.repository=$R/sa-api-gateway \
            --set api-gateway.image.tag=$T \
            --set auth-service.image.repository=$R/sa-auth-service \
            --set auth-service.image.tag=$T \
            --set transaction-service.image.repository=$R/sa-transaction-service \
            --set transaction-service.image.tag=$T \
            --set approval-service.image.repository=$R/sa-approval-service \
            --set approval-service.image.tag=$T \
            --set notification-service.image.repository=$R/sa-notification-service \
            --set notification-service.image.tag=$T \
            --set cronjobs.insertDb.image.repository=$R/sa-cronjobs \
            --set cronjobs.insertDb.image.tag=$T \
            --set cronjobs.summaryBroker.image.repository=$R/sa-cronjobs \
            --set cronjobs.summaryBroker.image.tag=$T
