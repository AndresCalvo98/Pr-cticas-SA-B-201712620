apiVersion: v1
kind: ResourceQuota
metadata:
  name: sa-platform-quota
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "30"

---
apiVersion: v1
kind: LimitRange
metadata:
  name: sa-platform-limits
spec:
  limits:
    - default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      type: Container
