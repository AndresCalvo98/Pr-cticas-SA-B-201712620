<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2 - Autenticación y Autorización</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="glass-panel p-8 rounded-2xl w-full max-w-md shadow-2xl relative overflow-hidden">
        <div class="absolute -top-20 -right-20 w-40 h-40 bg-blue-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20"></div>
        <div class="absolute -bottom-20 -left-20 w-40 h-40 bg-purple-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20"></div>
        
        <div class="relative z-10">
            <h1 class="text-3xl font-bold text-center mb-2 bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent">Bienvenido</h1>
            <p class="text-center text-slate-400 mb-8" id="form-subtitle">Inicia sesión en tu cuenta</p>

            <div id="alert-box" class="hidden mb-4 p-3 rounded-lg text-sm font-medium"></div>

            <!-- Login Form -->
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1 text-slate-300">Correo Electrónico</label>
                    <input type="email" id="login-email" required class="w-full px-4 py-2 bg-slate-800/50 border border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1 text-slate-300">Contraseña</label>
                    <input type="password" id="login-password" required class="w-full px-4 py-2 bg-slate-800/50 border border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all">
                </div>
                <button type="submit" class="w-full py-2.5 bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 rounded-lg font-semibold transition-all shadow-lg transform hover:scale-[1.02]">Ingresar</button>
                <p class="text-center text-sm text-slate-400 mt-4">¿No tienes cuenta? <a href="#" id="show-register" class="text-blue-400 hover:text-blue-300 transition-colors">Regístrate aquí</a></p>
            </form>

            <!-- Register Form (Hidden by default) -->
            <form id="register-form" class="space-y-4 hidden">
                <div>
                    <label class="block text-sm font-medium mb-1 text-slate-300">Nombre Completo</label>
                    <input type="text" id="reg-name" required class="w-full px-4 py-2 bg-slate-800/50 border border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1 text-slate-300">Correo Electrónico</label>
                    <input type="email" id="reg-email" required class="w-full px-4 py-2 bg-slate-800/50 border border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1 text-slate-300">Contraseña</label>
                    <input type="password" id="reg-password" required class="w-full px-4 py-2 bg-slate-800/50 border border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1 text-slate-300">Rol</label>
                    <select id="reg-role" required class="w-full px-4 py-2 bg-slate-800/50 border border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all text-white">
                        <option value="Cliente">Cliente</option>
                        <option value="Admin">Admin</option>
                    </select>
                </div>
                <button type="submit" class="w-full py-2.5 bg-gradient-to-r from-purple-600 to-blue-600 hover:from-purple-500 hover:to-blue-500 rounded-lg font-semibold transition-all shadow-lg transform hover:scale-[1.02]">Crear Cuenta</button>
                <p class="text-center text-sm text-slate-400 mt-4">¿Ya tienes cuenta? <a href="#" id="show-login" class="text-purple-400 hover:text-purple-300 transition-colors">Inicia sesión</a></p>
            </form>
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
