apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sa-platform-root-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL | default "https://github.com/AndresCalvo98/software-avanzado-gitops.git" }}
    targetRevision: {{ .Values.targetRevision | default "main" }}
    path: apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
