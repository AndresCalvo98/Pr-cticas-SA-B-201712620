# RabbitMQ usando imagen oficial de Docker Hub (siempre disponible)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sa-platform-rabbitmq
  namespace: {{ .Release.Namespace }}
  labels:
    app: rabbitmq
spec:
  serviceName: sa-platform-rabbitmq-headless
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: "rabbitmq:3.13-management"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5672
              name: amqp
            - containerPort: 15672
              name: management
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: "AndresCalvo"
            - name: RABBITMQ_DEFAULT_PASS
              value: "123456"
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "ping"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "status"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: sa-platform-rabbitmq
  namespace: {{ .Release.Namespace }}
  labels:
    app: rabbitmq
spec:
  ports:
    - port: 5672
      name: amqp
      targetPort: amqp
    - port: 15672
      name: management
      targetPort: management
  selector:
    app: rabbitmq
---
apiVersion: v1
kind: Service
metadata:
  name: sa-platform-rabbitmq-headless
  namespace: {{ .Release.Namespace }}
  labels:
    app: rabbitmq
spec:
  clusterIP: None
  ports:
    - port: 5672
      name: amqp
  selector:
    app: rabbitmq
