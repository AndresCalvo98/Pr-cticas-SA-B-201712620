apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sa-platform-ingress
  labels:
    app.kubernetes.io/name: sa-platform
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-api-gateway
                port:
                  number: 80
