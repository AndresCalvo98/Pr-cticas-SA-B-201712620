apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa-platform-cronjobs
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cronjob-role
rules:
  - apiGroups: [""]
    resources: ["pods", "logs"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cronjob-rolebinding
subjects:
  - kind: ServiceAccount
    name: sa-platform-cronjobs
roleRef:
  kind: Role
  name: cronjob-role
  apiGroup: rbac.authorization.k8s.io
